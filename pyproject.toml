[project]
name = "multi-agent-chat"
version = "2.1.0"
description = "A Hermes-based CLI multi-agent group chat system with persistent agent processes and structured speech control."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "jasonno1", email = "jasonno1@example.com"}
]
requires-python = ">=3.9"
keywords = ["hermes", "multi-agent", "cli", "chat", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: macOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

[project.scripts]
mac = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "bus*", "agents*", "rules*", "bridge*", "ui*", "config*", "state*"]
